defaults:
  # Estimation window, applied before complete-case selection. Stated explicitly
  # because otherwise the sample is whatever dropna leaves, i.e. an accident of
  # how far each input series runs -- the 2026-08 fix to the annual-to-quarterly
  # interpolation extended the firm count by four quarters and would have moved
  # the sample to 2013Q4 without anyone choosing that.
  sample_start: 1982-01-01
  sample_end: 2012-12-31
  n_iter: 12000
  burn: 4000
  thin: 5
  chains: 2
  seed: 12345
  n_transform: log100_centered10
  competition_measurement:
    # The firm count is annual (31 observations over 1982-2012), so the main design
    # observes it in Q4 only and infers the intervening quarters inside the state-space
    # model. The interpolated alternative is still estimated and reported as a
    # comparison, but it is not the default: PCHIP manufactures within-year variation,
    # drives sigma_N to a third of its mixed-frequency value, forces the AR(2) cycle to
    # a near-unit root and thereby opens a near-exact ridge between Nbar and Nhat
    # (posterior correlation -0.9996 against +0.13). See paper section "What PCHIP
    # interpolation does to the estimates".
    frequency: annual_q4
    annual_timing: q4
  covariance_structure: e_zeta_only
  # Particle count for the hsa_full Particle-Gibbs state update. A pilot over
  # 128/256/512 particles found ess-per-particle flat at ~0.38 across the range,
  # i.e. returns had not begun to diminish; 512 is the operating point, not a
  # demonstrated optimum. Re-run scripts/appendix_particle_gibbs_hsa_full.py
  # pilot to reproduce the sweep.
  n_particles: 512
  enforce_stationary: true
  ar2_max_tries: 2000
  coefficient_constraints:
    enabled: false
    max_tries: 1000
    positive: []
    bounds: {}
# SEC inverse-HHI extension: which cross-market aggregate of the SIC3
# revenue-share HHIs is used as the competition series.  All four are built into
# model_ready_sec_inverse_hhi.csv by scripts/15_build_extension_data.py; this
# block selects which one an extension run grid uses.
#
# Within a market the HHI is always revenue-based.  These differ only in the
# weight used to collapse ~250 markets into one number per quarter.  The
# estimated equation is linear in N = (100 log N_raw - c)/10, so aggregating a
# market-level kappa_m with expenditure weights implies the revenue-weighted
# mean of log(1/HHI_m) -- revenue_log_weighted.  That is the recommended
# headline; firm_weighted is what the August 2026 grid ran on and is kept so
# those runs stay reproducible.
sec_competition_variants:
  default: firm_weighted
  recommended: revenue_log_weighted
  variants:
    firm_weighted:
      column: N_SEC_inverse_HHI
      label: SEC inverse HHI, firm-count-weighted market mean
      spec_suffix: ""
    revenue_weighted:
      column: N_SEC_inverse_HHI_revw
      label: SEC inverse HHI, revenue-weighted market mean
      spec_suffix: _revw
    revenue_log_weighted:
      column: N_SEC_inverse_HHI_logrevw
      label: SEC inverse HHI, revenue-weighted geometric mean
      spec_suffix: _logrevw
    revenue_log_weighted_exfin:
      column: N_SEC_inverse_HHI_logrevw_exfin
      label: SEC inverse HHI, revenue-weighted geometric mean, excluding SIC 6000-6999
      spec_suffix: _logrevw_exfin
run_data_specs:
  - inv_markup
  - output_gap_bn
  - output_gap_bn_core
  - output_gap_hp
  - output_gap_hp_core
  - output_gap_bn_ppi
  - output_gap_hp_ppi
  - labor_share_gap_hp
  - unemployment_gap
  - unemployment_gap_core
  - unemployment_gap_ppi
data_specs:
  inv_markup:
    label: Inverse markup gap
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: markup_BN_inv
    x_prev_col: markup_BN_inv_prev
    n_col: N_Gustavo
  output_gap_bn:
    label: Output gap, BN filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
  output_gap_hp:
    label: Output gap, HP filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: output_gap_HP
    x_prev_col: output_gap_HP_prev
    n_col: N_Gustavo
  output_gap_hp_core:
    label: Output gap HP, core CPI
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: output_gap_HP
    x_prev_col: output_gap_HP_prev
    n_col: N_Gustavo
  output_gap_bn_ppi:
    label: Output gap BN, PPI
    pi_col: pi_ppi
    pi_prev_col: pi_ppi_prev
    # The Cleveland Fed series is a model-based one-year expected-inflation
    # estimate, not an SPF forecast and not price-index-specific. Keep it here
    # as a semi-structural comparison; relative to core CPI this also changes
    # the inflation transform (simple percentage change versus log difference).
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
  output_gap_hp_ppi:
    label: Output gap HP, PPI
    pi_col: pi_ppi
    pi_prev_col: pi_ppi_prev
    pi_expect_col: Epi
    x_col: output_gap_HP
    x_prev_col: output_gap_HP_prev
    n_col: N_Gustavo
  labor_share_gap_hp:
    label: Labor share gap, HP filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: labor_share_gap_HP
    x_prev_col: labor_share_gap_HP_prev
    n_col: N_Gustavo
  unemployment_gap:
    label: Unemployment gap
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
  unemployment_gap_core:
    label: Unemployment gap, core CPI
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
  unemployment_gap_core_establishment:
    label: DEPRECATED legacy BED/HP direct-loading experiment
    # Archived only; new work must use unemployment_gap_core_qcew_joint below.
    # This legacy specification is excluded from every production run grid.
    sample_start: 1993-04-01
    sample_end: 2012-12-31
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
    e_col: establishment_stock
    e_transform: log100_centered10
    e_cycle_filter: hp
    e_hp_lambda: 1600.0
    establishment_model: legacy_hp_loading
  unemployment_gap_core_qcew_joint:
    label: Unemployment gap, core CPI, joint firm and QCEW establishment states
    sample_start: 1982-01-01
    sample_end: 2012-12-31
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
    e_col: qcew_establishments
    e_transform: log100_centered10
    establishment_model: joint_state
  unemployment_gap_ppi:
    label: Unemployment gap, PPI
    pi_col: pi_ppi
    pi_prev_col: pi_ppi_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
  unemployment_gap_tnic:
    label: Unemployment gap, TNIC competition
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_TNIC
  unemployment_gap_core_tnic:
    label: Unemployment gap, core CPI, TNIC competition
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_TNIC
  output_gap_bn_core:
    label: Output gap BN, core CPI
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
  default:
    label: Output gap, BN filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
models:
  - ces
  - hsa_steady
  - hsa_dynamic
  - hsa_full
  - hsa_const_theta

# New theory-model namespace. The legacy ``models`` grid above is intentionally
# unchanged and remains reproducible at its historical estimation revision.
theory_models:
  - hsa_f0
  - hsa_u
  - hsa_r1
  - hsa_r2
  - hsa_r3
theory_defaults:
  estimation_revision: 2026-08-moving-reference-hsa-v1
  structural_frequency: quarterly
  zeta0_treatment: fixed
  zeta0: 6.0
  N0_anchor: geometric_mean_over_estimation_sample
  require_path_positivity: true
  # Restricted models are deliberately limited to the quarterly observation
  # until a four-quarter aggregation likelihood is implemented. The legacy YoY
  # regression never receives the quarterly identity directly.
  inflation_observations:
    - qoq
theory_run_data_specs:
  - theory_inv_markup_qoq
  - theory_inv_markup_yoy_4q
theory_data_specs:
  theory_inv_markup_qoq:
    name: theory_inv_markup_qoq
    label: Inverse markup gap, quarterly inflation
    pi_col: pi_cpi_qoq
    pi_prev_col: pi_cpi_qoq_prev
    pi_expect_col: Epi_qoq
    x_col: markup_BN_inv
    x_prev_col: markup_BN_inv_prev
    n_col: N_Gustavo
    inflation_observation: qoq
    inflation_transformation: exact_qoq_percent_change_nonannualized
    expectation_horizon: one_year_source_converted_to_quarterly_rate
    expectation_information_date: quarterly_average_of_monthly_vintage_unverified
    expectation_transformation: annual_percent_divided_by_4
    activity_mapping: real_marginal_cost_proxy
    marginal_cost_loading: 1.0
    activity_transformation: BN_inverse_markup_gap
    models: [hsa_f0, hsa_u, hsa_r1, hsa_r2, hsa_r3]
  theory_inv_markup_yoy_4q:
    name: theory_inv_markup_yoy_4q
    label: Inverse markup gap, four-quarter YoY inflation (unrestricted comparison only)
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: markup_BN_inv
    x_prev_col: markup_BN_inv_prev
    n_col: N_Gustavo
    inflation_observation: yoy_4q
    inflation_transformation: exact_four_quarter_percent_change
    expectation_horizon: one_year
    expectation_information_date: quarterly_average_of_monthly_vintage_unverified
    expectation_transformation: annual_percent_as_loaded
    activity_mapping: real_marginal_cost_proxy
    marginal_cost_loading: 1.0
    activity_transformation: BN_inverse_markup_gap
    # Direct YoY is a reduced-form observation comparison. The quarterly
    # structural equality is not imposed, so only F0 and U are admissible.
    models: [hsa_f0, hsa_u]
