defaults:
  # Estimation window, applied before complete-case selection. Stated explicitly
  # because otherwise the sample is whatever dropna leaves, i.e. an accident of
  # how far each input series runs -- the 2026-08 fix to the annual-to-quarterly
  # interpolation extended the firm count by four quarters and would have moved
  # the sample to 2013Q4 without anyone choosing that.
  sample_start: 1982-01-01
  sample_end: 2012-12-31
  n_iter: 12000
  burn: 4000
  thin: 5
  chains: 2
  seed: 12345
  n_transform: log100_centered10
  competition_measurement:
    # The firm count is annual (31 observations over 1982-2012), so the main design
    # observes it in Q4 only and infers the intervening quarters inside the state-space
    # model. The interpolated alternative is still estimated and reported as a
    # comparison, but it is not the default: PCHIP manufactures within-year variation,
    # drives sigma_N to a third of its mixed-frequency value, forces the AR(2) cycle to
    # a near-unit root and thereby opens a near-exact ridge between Nbar and Nhat
    # (posterior correlation -0.9996 against +0.13). See paper section "What PCHIP
    # interpolation does to the estimates".
    frequency: annual_q4
    annual_timing: q4
  covariance_structure: e_zeta_only
  # Particle count for the hsa_full Particle-Gibbs state update. A pilot over
  # 128/256/512 particles found ess-per-particle flat at ~0.38 across the range,
  # i.e. returns had not begun to diminish; 512 is the operating point, not a
  # demonstrated optimum. Re-run scripts/appendix_particle_gibbs_hsa_full.py
  # pilot to reproduce the sweep.
  n_particles: 512
  enforce_stationary: true
  ar2_max_tries: 2000
  coefficient_constraints:
    enabled: false
    max_tries: 1000
    positive: []
    bounds: {}
run_data_specs:
  - inv_markup
  - output_gap_bn
  - output_gap_bn_core
  - output_gap_hp
  - output_gap_hp_core
  - output_gap_bn_ppi
  - output_gap_hp_ppi
  - labor_share_gap_hp
  - unemployment_gap
  - unemployment_gap_core
  - unemployment_gap_ppi
data_specs:
  inv_markup:
    label: Inverse markup gap
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: markup_BN_inv
    x_prev_col: markup_BN_inv_prev
    n_col: N_Gustavo
  output_gap_bn:
    label: Output gap, BN filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
  output_gap_hp:
    label: Output gap, HP filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: output_gap_HP
    x_prev_col: output_gap_HP_prev
    n_col: N_Gustavo
  output_gap_hp_core:
    label: Output gap HP, core CPI
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: output_gap_HP
    x_prev_col: output_gap_HP_prev
    n_col: N_Gustavo
  output_gap_bn_ppi:
    label: Output gap BN, PPI
    pi_col: pi_ppi
    pi_prev_col: pi_ppi_prev
    # The SPF does not publish a PPI expectation.  Keep the same external
    # expectation series as in the CPI specifications so that CPI/PPI changes
    # only the observed inflation measure.  The report treats this as a
    # measurement comparison, not as a fully matched structural PPI equation.
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
  output_gap_hp_ppi:
    label: Output gap HP, PPI
    pi_col: pi_ppi
    pi_prev_col: pi_ppi_prev
    pi_expect_col: Epi
    x_col: output_gap_HP
    x_prev_col: output_gap_HP_prev
    n_col: N_Gustavo
  labor_share_gap_hp:
    label: Labor share gap, HP filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: labor_share_gap_HP
    x_prev_col: labor_share_gap_HP_prev
    n_col: N_Gustavo
  unemployment_gap:
    label: Unemployment gap
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
  unemployment_gap_core:
    label: Unemployment gap, core CPI
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
  unemployment_gap_ppi:
    label: Unemployment gap, PPI
    pi_col: pi_ppi
    pi_prev_col: pi_ppi_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_Gustavo
  unemployment_gap_tnic:
    label: Unemployment gap, TNIC competition
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_TNIC
  unemployment_gap_core_tnic:
    label: Unemployment gap, core CPI, TNIC competition
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: unemp_gap
    x_prev_col: unemp_gap_prev
    n_col: N_TNIC
  output_gap_bn_core:
    label: Output gap BN, core CPI
    pi_col: pi_cpi_core
    pi_prev_col: pi_cpi_core_prev
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
  default:
    label: Output gap, BN filter
    pi_col: pi_cpi
    pi_prev_col: pi_cpi_prev
    pi_expect_col: Epi
    x_col: output_gap_BN
    x_prev_col: output_gap_BN_prev
    n_col: N_Gustavo
models:
