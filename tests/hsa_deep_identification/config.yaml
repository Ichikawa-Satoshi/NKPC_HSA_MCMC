  posterior_prior_sd_ratio: 0.75
  max_condition_number: 30.0
  min_direct_orthogonal_share: 0.20
  kappa_path_positive_probability: 0.95
  log_bayes_factor: 1.0986122886681098
  marginal_likelihood_repeat_tolerance: 0.25

sampling:
  seed: 20260827
  mock: {iterations: 600, warmup: 200, thin: 2, chains: 2}
  quick: {iterations: 4000, warmup: 1200, thin: 4, chains: 2}
  full: {iterations: 24000, warmup: 8000, thin: 8, chains: 4}
