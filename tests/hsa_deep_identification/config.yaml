  allocation: gustavo_q4_capital_iq_measurement_only
  state_candidates: [quarterly_local_level_ar2, annual_allocation_ar2, local_linear_ar2]
  cycle_period_bounds_quarters: [6.0, 24.0]
  cycle_damping_bounds: [0.25, 0.98]
  omega_prior: [2.0, 8.0]
  omega_mh_sd: 0.50
  omega_sampler: slice_logit
  omega_slice_width: 1.0
  collapsed_stride: 10
  tau2_prior_shape: 3.0
  tau2_scale_fraction: 0.15
  tau2_slice_width: 0.5
  cycle_damping_prior: [8.0, 2.0]
  cycle_damping_initial: 0.80
  cycle_damping_mh_sd: 0.50
  cycle_damping_slice_width: 0.6
  cycle_period_prior_mean: 12.0
  cycle_period_prior_sd: 4.0
  cycle_period_initial: 12.0
  cycle_period_mh_sd: 0.90
  cycle_period_slice_width: 0.8

inflation:
